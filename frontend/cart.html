<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | Pathaan Collection</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
:root{
  --primary:#d8b576;
  --secondary:#e4c990;
  --dark:#11100e;
  --dark2:#191714;
  --dark3:#24211c;
  --text:#f4efe5;
  --gray:#b9b09f;
  --green:#10b981;
  --red:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{
  background:var(--dark);
  color:var(--text);
  min-height:100vh;
  padding:20px 15px;
  background-image:radial-gradient(circle at top right,rgba(199,164,106,0.12),transparent 40%),
                   radial-gradient(circle at bottom left,rgba(199,164,106,0.07),transparent 40%);
}
.header-bar{
  max-width:1050px;
  margin:0 auto 25px auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header-bar a{
  color:var(--gray);
  text-decoration:none;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:0.2s;
}
.header-bar a:hover{color:var(--primary)}
.header-bar h1{
  font-size:24px;
  color:var(--primary);
  display:flex;
  align-items:center;
  gap:10px;
}
.wrapper{
  max-width:1050px;
  margin:auto;
  display:grid;
  grid-template-columns:1.8fr 1fr;
  gap:28px;
}
@media (max-width:850px){
  .wrapper{grid-template-columns:1fr}
}
.cart-items-card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;
  padding:20px;
  backdrop-filter:blur(10px);
}
.cart-actions-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:14px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  margin-bottom:14px;
}
.btn-clear{
  background:transparent;
  border:1px solid rgba(239,68,68,0.4);
  color:var(--red);
  padding:6px 12px;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
  transition:0.2s;
}
.btn-clear:hover{
  background:rgba(239,68,68,0.15);
}
.cart-item{
  display:flex;
  align-items:center;
  gap:16px;
  padding:16px 0;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.cart-item:last-child{border-bottom:none}
.cart-item img{
  width:80px;
  height:85px;
  border-radius:12px;
  object-fit:cover;
  background:#1a1a24;
}
.item-details{
  flex:1;
}
.item-title{
  font-size:15px;
  font-weight:600;
  color:#fff;
  margin-bottom:4px;
}
.item-title a{
  color:#fff;
  text-decoration:none;
  transition:0.2s;
}
.item-title a:hover{color:var(--primary)}
.item-badges{
  display:flex;
  gap:8px;
  font-size:12px;
  color:var(--gray);
  margin-bottom:6px;
}
.item-price{
  font-size:16px;
  font-weight:bold;
  color:var(--primary);
}
.qty-controls{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--dark2);
  border:1px solid rgba(255,255,255,0.1);
  padding:4px 8px;
  border-radius:10px;
}
.qty-btn{
  background:transparent;
  border:none;
  color:#fff;
  font-size:14px;
  cursor:pointer;
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
}
.qty-btn:hover{background:rgba(255,255,255,0.1)}
.qty-display{
  font-weight:bold;
  font-size:14px;
  min-width:18px;
  text-align:center;
}
.btn-delete{
  background:transparent;
  border:none;
  color:var(--gray);
  cursor:pointer;
  font-size:15px;
  padding:8px;
  transition:0.2s;
}
.btn-delete:hover{color:var(--red)}

/* Order Summary Box */
.summary-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;
  padding:24px;
  height:fit-content;
}
.summary-card h2{
  font-size:18px;
  color:var(--secondary);
  margin-bottom:16px;
}
.coupon-box{
  display:flex;
  gap:8px;
  margin:16px 0;
}
.coupon-input{
  flex:1;
  background:var(--dark2);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:10px;
  padding:10px 12px;
  color:#fff;
  font-size:13px;
  outline:none;
  text-transform:uppercase;
}
.btn-apply{
  background:#27272a;
  border:1px solid rgba(255,255,255,0.15);
  color:#fff;
  padding:0 14px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}
.btn-apply:hover{background:var(--primary)}
.line-row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  color:var(--gray);
  margin-top:10px;
}
.line-row.total{
  font-size:18px;
  font-weight:bold;
  color:#fff;
  border-top:1px dashed rgba(255,255,255,0.15);
  padding-top:14px;
  margin-top:14px;
}
.btn-checkout{
  width:100%;
  padding:14px;
  background:linear-gradient(135deg,#e1c98e,#c7a46a 58%,#a98245);
  color:#fff;
  border:none;
  border-radius:12px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-top:18px;
  box-shadow:0 6px 20px rgba(199,164,106,0.24);
  transition:0.3s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn-checkout:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(199,164,106,0.36);
}
.empty-state{
  text-align:center;
  padding:60px 20px;
}
.empty-icon{
  font-size:48px;
  color:var(--gray);
  margin-bottom:14px;
}
</style>
</head>
<body>

<div class="header-bar">
  <h1><i class="fa-solid fa-bag-shopping"></i> My Shopping Cart</h1>
  <a href="/shop.html"><i class="fa-solid fa-arrow-left"></i> Continue Shopping</a>
</div>

<div class="wrapper">
  <!-- Items Column -->
  <div class="cart-items-card">
    <div class="cart-actions-bar">
      <span id="itemCountDisplay" style="color:var(--gray);font-size:13px">Loading items...</span>
      <button class="btn-clear" onclick="clearCart()"><i class="fa-solid fa-trash-can"></i> Clear Cart</button>
    </div>
    <div id="cartItemsList"></div>
  </div>

  <!-- Summary Column -->
  <div class="summary-card">
    <h2>Summary</h2>
    
    <div class="line-row">
      <span>Subtotal</span>
      <span id="subtotalDisplay">₹0</span>
    </div>
    
    <div class="line-row" id="discountRow" style="display:none;color:var(--green)">
      <span>Promo Discount (10%)</span>
      <span id="discountDisplay">-₹0</span>
    </div>

    <div class="line-row">
      <span>Estimated Shipping</span>
      <span style="color:var(--green)">FREE</span>
    </div>

    <div class="coupon-box">
      <input type="text" class="coupon-input" id="couponCode" placeholder="Promo code (e.g. LUXURY10)">
      <button class="btn-apply" onclick="applyCoupon()">Apply</button>
    </div>

    <div class="line-row total">
      <span>Total</span>
      <span id="totalDisplay" style="color:var(--primary)">₹0</span>
    </div>

    <button class="btn-checkout" onclick="proceedToCheckout()">
      Checkout Now <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>
</div>

<script src="/config.js"></script>
<script src="/toast.js"></script>
<script>
let cartItems = [];
let discountAmount = 0;

window.addEventListener("DOMContentLoaded", () => {
  if (!requireLogin()) return;
  loadCartData();
});

async function loadCartData() {
  try {
    const res = await fetch(API_BASE + "/api/cart", { headers: getAuthHeader() });
    if (!res.ok) throw new Error("Could not fetch cart");
    cartItems = await res.json();
    renderCart();
  } catch (e) {
    showToast(e.message || "Failed to load cart", "error");
  }
}

function renderCart() {
  const container = document.getElementById("cartItemsList");
  const countEl = document.getElementById("itemCountDisplay");

  if (!cartItems.length) {
    countEl.innerText = "0 items in your bag";
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon"><i class="fa-solid fa-basket-shopping"></i></div>
        <h3>Your shopping cart is empty</h3>
        <p style="color:var(--gray);font-size:13px;margin:8px 0 20px 0">Discover our newest luxury arrivals</p>
        <a href="/shop.html" style="display:inline-block;padding:10px 20px;background:var(--primary);color:#fff;border-radius:10px;text-decoration:none;font-weight:bold;">
          Explore Products
        </a>
      </div>
    `;
    updateSummary(0);
    return;
  }

  countEl.innerText = `${cartItems.length} item(s) in your bag`;

  let subtotal = 0;
  container.innerHTML = cartItems.map(item => {
    const p = item.productId || {};
    const imgUrl = getProductImageUrl(p.images?.[0]);
    const itemSubtotal = (p.price || 0) * (item.quantity || 1);
    subtotal += itemSubtotal;

    return `
      <div class="cart-item">
        <a href="/product-details.html?id=${p._id}">
          <img src="${imgUrl}" alt="${escapeHtml(p.name || '')}">
        </a>
        <div class="item-details">
          <div class="item-title">
            <a href="/product-details.html?id=${p._id}">${escapeHtml(p.name || 'Product')}</a>
          </div>
          <div class="item-badges">
            <span>Size: <b>${escapeHtml(item.size || 'M')}</b></span>
            <span>Color: <b>${escapeHtml(item.color || 'Default')}</b></span>
          </div>
          <div class="item-price">${formatPrice(p.price || 0)}</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="updateItemQty('${item._id}', ${item.quantity - 1})">-</button>
          <span class="qty-display">${item.quantity}</span>
          <button class="qty-btn" onclick="updateItemQty('${item._id}', ${item.quantity + 1})">+</button>
        </div>
        <button class="btn-delete" title="Remove Item" onclick="removeItem('${item._id}')">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    `;
  }).join("");

  updateSummary(subtotal);
}

function updateSummary(subtotal) {
  const total = Math.max(0, subtotal - discountAmount);
  document.getElementById("subtotalDisplay").innerText = formatPrice(subtotal);
  document.getElementById("totalDisplay").innerText = formatPrice(total);
  
  const discountRow = document.getElementById("discountRow");
  if (discountAmount > 0) {
    discountRow.style.display = "flex";
    document.getElementById("discountDisplay").innerText = "-" + formatPrice(discountAmount);
  } else {
    discountRow.style.display = "none";
  }
}

async function updateItemQty(itemId, newQty) {
  if (newQty < 1) {
    return removeItem(itemId);
  }
  try {
    const res = await fetch(API_BASE + `/api/cart/${itemId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", ...getAuthHeader() },
      body: JSON.stringify({ quantity: newQty })
    });
    if (res.ok) {
      loadCartData();
    }
  } catch (e) {
    showToast("Failed to update quantity", "error");
  }
}

async function removeItem(itemId) {
  try {
    const res = await fetch(API_BASE + `/api/cart/${itemId}`, {
      method: "DELETE",
      headers: getAuthHeader()
    });
    if (res.ok) {
      showToast("Item removed", "info");
      loadCartData();
    }
  } catch (e) {
    showToast("Failed to remove item", "error");
  }
}

async function clearCart() {
  if (!confirm("Remove all items from your cart?")) return;
  try {
    const res = await fetch(API_BASE + "/api/cart/clear/all", {
      method: "DELETE",
      headers: getAuthHeader()
    });
    if (res.ok) {
      showToast("Cart cleared", "info");
      loadCartData();
    }
  } catch (e) {
    showToast("Failed to clear cart", "error");
  }
}

function applyCoupon() {
  const code = document.getElementById("couponCode").value.trim().toUpperCase();
  if (code === "LUXURY10" || code === "PATHAAN10") {
    let subtotal = cartItems.reduce((acc, it) => acc + ((it.productId?.price || 0) * (it.quantity || 1)), 0);
    discountAmount = Math.round(subtotal * 0.1);
    showToast("Coupon Applied! 10% Discount", "success");
    updateSummary(subtotal);
  } else {
    showToast("Invalid promo code", "error");
  }
}

function proceedToCheckout() {
  if (!cartItems.length) {
    return showToast("Cart is empty", "error");
  }

  // Format cart items for checkout
  const checkoutItems = cartItems.map(it => {
    const p = it.productId || {};
    return {
      productId: p._id,
      name: p.name,
      price: p.price,
      image: p.images?.[0] || "",
      qty: it.quantity || 1,
      size: it.size || "M",
      color: it.color || "Default"
    };
  });

  localStorage.setItem("checkoutCart", JSON.stringify(checkoutItems));
  localStorage.removeItem("buyNowItem");
  window.location.href = "/contact.html";
}
</script>
</body>
</html>
